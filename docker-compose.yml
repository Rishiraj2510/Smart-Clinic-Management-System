version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: clinic-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: clinic_db
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db_setup.sql:/docker-entrypoint-initdb.d/db_setup.sql
    networks:
      - clinic-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: clinic-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - clinic-network

  app:
    build: .
    container_name: clinic-app
    ports:
      - "8080:8080"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=clinic_db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_DATABASE=clinic_mongo_db
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - clinic-network

volumes:
  mysql-data:
  mongo-data:

networks:
  clinic-network:
    driver: bridge
